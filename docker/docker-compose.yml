services:
  
  nginx:
    image: nginx:1.29.8
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /home/deploy/nginx.conf:/etc/nginx/conf.d/default.conf
      - /home/deploy/nginx.crt:/etc/nginx/certs/nginx.crt
      - /home/deploy/nginx.key:/etc/nginx/certs/nginx.key
    restart: unless-stopped
  

  prometheus:
      image: prom/prometheus:v3.16.0
      volumes:
        - /home/deploy/prometheus.yml:/etc/prometheus/prometheus.yml
      ports:
        - "127.0.0.1:9090:9090"
      restart: unless-stopped


  grafana:
    image: grafana/grafana:13.3.0
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.12.1
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    restart: unless-stopped
